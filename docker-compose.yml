# 一键启动：cp .env.example .env 并填写密钥后执行 docker compose up -d --build
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      MYSQL_DATABASE: learningo-agents
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/server/learningo_agents.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  model:
    build: ./model
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?请在 .env 中设置 DASHSCOPE_API_KEY}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      # true 时所有对话模型档位统一使用 qwen-turbo；false 恢复 max/plus/turbo 分档
      QWEN_FORCE_TURBO: ${QWEN_FORCE_TURBO:-true}
      QWEN_MODEL_MAX: ${QWEN_MODEL_MAX:-qwen-max}
      QWEN_MODEL_PLUS: ${QWEN_MODEL_PLUS:-qwen-plus}
      QWEN_MODEL_TURBO: ${QWEN_MODEL_TURBO:-qwen-turbo}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-qwen3.7-text-embedding}
      QWEN_EMBEDDING_DIMENSION: ${QWEN_EMBEDDING_DIMENSION:-1024}
      QWEN_RERANK_MODEL: ${QWEN_RERANK_MODEL:-qwen3-rerank}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-qwen-vl-max}
      SECRET_KEY: ${AI_API_SHARED_JWT_SECRET:?请在 .env 中设置 AI_API_SHARED_JWT_SECRET}
      MEDICAL_DOCS_DIR: /app/data/documents
    volumes:
      - ./model/data:/app/data
      - chroma-data:/app/app/chroma_db_unified

  backend:
    build: ./backend/server
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: learningo-agents
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      AI_API_URL: http://model:8000
      AI_API_SHARED_JWT_SECRET: ${AI_API_SHARED_JWT_SECRET}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-https://oss-cn-beijing.aliyuncs.com}
      OSS_BUCKET: ${OSS_BUCKET:-darkside}
      OSS_REGION: ${OSS_REGION:-cn-beijing}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?请在 .env 中设置 OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?请在 .env 中设置 OSS_ACCESS_KEY_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      model:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  chroma-data:
