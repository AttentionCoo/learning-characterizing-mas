aiserver:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:3306}
    database: ${DB_NAME:learningo-agents}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

  ai-api:
    url: ${AI_API_URL:http://localhost:8000}
    shared-jwt-secret: ${AI_JWT_SECRET:dev-local-secret}

  alioss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucketName: ${OSS_BUCKET:darkside}
    region: ${OSS_REGION:cn-beijing}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}

logging:
  level:
    root: INFO