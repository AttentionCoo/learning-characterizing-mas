aiserver:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${DB_HOST:127.0.0.1}
    port: ${DB_PORT:3306}
    database: ${DB_NAME:learningo-agents}
    username: ${DB_USERNAME:learningo-agents}
    password: ${DB_PASSWORD:123456}

  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

  ai-api:
    url: ${AI_API_URL:http://127.0.0.1:8000}
    # 宝塔直接运行 JAR 时可复用模型服务的 SECRET_KEY；专用变量仍具有最高优先级。
    shared-jwt-secret: ${AI_API_SHARED_JWT_SECRET:${SECRET_KEY:your-secret-key-here}}

  alioss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucketName: ${OSS_BUCKET:darkside}
    region: ${OSS_REGION:cn-beijing}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    document-prefix: ${OSS_DOC_PREFIX:documents/}
    sign-url-expiration: 1800


logging:
  level:
    root: INFO
    com.learnagent: INFO
  file:
    max-size: 100MB
    max-history: 30
